firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const btn = document.getElementById("startBtn");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

function log(msg) {
  logEl.textContent += msg + "\n";
}

auth.onAuthStateChanged(async (user) => {
  if (user) {
    statusEl.innerHTML = '<p class="ok">Login terdeteksi: ' + (user.email || user.uid) + '</p>';
    btn.disabled = false;
    btn.textContent = 'UPDATE 300 DATA';
  } else {
    statusEl.innerHTML = '<p class="err">Belum login. Buka aplikasi Aman Diabetes dan login terlebih dahulu, lalu buka halaman ini lagi.</p>';
    btn.disabled = true;
    btn.textContent = 'Belum login';
  }
});

btn.addEventListener("click", async () => {
  if (!auth.currentUser) {
    alert("Kamu belum login.");
    return;
  }

  if (!confirm("Update 300 data carb_foods sekarang?\n\nYang diubah hanya serving_size dan serving_unit.\nTidak ada dokumen baru yang dibuat.")) return;

  btn.disabled = true;
  statusEl.innerHTML = '<p>Memproses...</p>';
  logEl.textContent = "";

  try {
    log("Membaca collection carb_foods...");
    const snap = await db.collection("carb_foods").get();

    const byName = new Map();
    snap.forEach(doc => {
      const name = doc.data().name;
      if (!name) return;
      if (!byName.has(name)) byName.set(name, []);
      byName.get(name).push(doc);
    });

    let found = 0, missing = 0, duplicate = 0, unchanged = 0, changed = 0;
    const updates = [];
    const problems = [];

    for (const item of foods) {
      const matches = byName.get(item.name) || [];

      if (matches.length === 0) {
        missing++;
        problems.push("TIDAK DITEMUKAN: " + item.name);
        continue;
      }

      if (matches.length > 1) {
        duplicate++;
        problems.push("DUPLIKAT (" + matches.length + "): " + item.name);
        continue;
      }

      found++;
      const doc = matches[0];
      const current = doc.data();

      const sameSize = Number(current.serving_size) === Number(item.serving_size);
      const sameUnit = String(current.serving_unit || "") === String(item.serving_unit || "");

      if (sameSize && sameUnit) {
        unchanged++;
        continue;
      }

      updates.push({
        ref: doc.ref,
        name: item.name,
        serving_size: item.serving_size,
        serving_unit: item.serving_unit
      });
      changed++;
    }

    log("Ditemukan: " + found);
    log("Perlu update: " + changed);
    log("Sudah sesuai: " + unchanged);
    log("Tidak ditemukan: " + missing);
    log("Duplikat: " + duplicate);

    if (problems.length) {
      log("\nMASALAH:");
      problems.forEach(p => log("- " + p));
    }

    if (updates.length > 0) {
      const batch = db.batch();
      updates.forEach(item => {
        batch.update(item.ref, {
          serving_size: item.serving_size,
          serving_unit: item.serving_unit
        });
      });

      log("\nMengirim " + updates.length + " update...");
      await batch.commit();
      log("UPDATE BERHASIL.");
    } else {
      log("\nTidak ada data yang perlu di-update.");
    }

    statusEl.innerHTML = '<p class="ok"><b>Selesai.</b> Update berhasil diproses.</p>';
    btn.textContent = 'Selesai';
  } catch (err) {
    console.error(err);
    log("\nERROR: " + (err.message || err));
    statusEl.innerHTML = '<p class="err"><b>Gagal.</b> Lihat pesan error di bawah.</p>';
    btn.disabled = false;
    btn.textContent = 'Coba Lagi';
  }
});
</script>
