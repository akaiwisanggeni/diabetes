firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const userEl = document.getElementById("user");
const seedBtn = document.getElementById("seed");
const statusEl = document.getElementById("status");

async function checkAuth() {
  try {
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  } catch (e) {
    console.warn("Persistence warning:", e);
  }

  // If this page was opened from the magic-link email, complete login here.
  if (auth.isSignInWithEmailLink(window.location.href)) {
    let email = window.localStorage.getItem("mpdEmailForSignIn") || window.localStorage.getItem("mpdSeedEmail");
    if (!email) email = window.prompt("Masukkan kembali email kamu:");
    if (email) {
      try {
        userEl.textContent = "Menyelesaikan login...";
        await auth.signInWithEmailLink(email, window.location.href);
        window.localStorage.removeItem("mpdSeedEmail");
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (err) {
        statusEl.textContent = "Login gagal: " + err.message;
      }
    }
  }
}

function renderUser(user) {
  if (!user) {
    userEl.innerHTML = 'Belum login di halaman ini. Jika Aman Diabetes sudah login, coba <button id="retry" type="button">Cek login lagi</button>.<br><br><b>Kalau tetap belum login:</b><br>Masukkan email akun Aman Diabetes untuk login via Magic Link.';
    seedBtn.disabled = true;
    showLoginForm();
    return;
  }
  userEl.textContent = "Login sebagai: " + (user.email || user.uid);
  seedBtn.disabled = false;
  statusEl.textContent = "Siap. Database berisi " + foods.length + " data.";
  const form = document.getElementById("seed-login-form");
  if (form) form.remove();
  const retry = document.getElementById("retry");
  if (retry) retry.remove();
}

function showLoginForm() {
  if (document.getElementById("seed-login-form")) return;
  const form = document.createElement("form");
  form.id = "seed-login-form";
  form.style.margin = "12px 0";
  form.innerHTML = '<input id="seed-email" type="email" placeholder="Email akun Aman Diabetes" required style="padding:12px;width:65%;max-width:420px;border:1px solid #ccc;border-radius:8px;font-size:16px"> <button type="submit">Kirim Link Login</button>';
  document.body.insertBefore(form, seedBtn);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("seed-email").value.trim();
    if (!email) return;
    statusEl.textContent = "Mengirim link login...";
    try {
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      await auth.sendSignInLinkToEmail(email, {
        url: window.location.origin + window.location.pathname,
        handleCodeInApp: true
      });
      window.localStorage.setItem("mpdSeedEmail", email);
      statusEl.textContent = "Link login dikirim. Buka email, klik linknya, lalu halaman ini akan login otomatis.";
    } catch (err) {
      statusEl.textContent = "Gagal mengirim link: " + err.message;
    }
  });
  const retry = document.getElementById("retry");
  if (retry) retry.addEventListener("click", () => {
    statusEl.textContent = "Mengecek sesi login...";
    setTimeout(() => renderUser(auth.currentUser), 1200);
  });
}

auth.onAuthStateChanged(renderUser);
checkAuth();

seedBtn.addEventListener("click", async () => {
  if (!auth.currentUser) {
    statusEl.textContent = "Belum login.";
    return;
  }
  seedBtn.disabled = true;
  statusEl.textContent = "Mengimpor 300 makanan...";
  try {
    const batch = db.batch();
    foods.forEach((food, i) => {
      const ref = db.collection("carb_foods").doc("food_" + String(i + 1).padStart(3, "0"));
      batch.set(ref, {
        name: food.name,
        category: food.category,
        carbs_per_100g: Number(food.carbs_per_100g),
        serving_size: Number(food.serving_size),
        serving_unit: food.serving_unit,
        seeded_by: auth.currentUser.uid,
        seeded_at: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
    });
    await batch.commit();
    const snap = await db.collection("carb_foods").get();
    statusEl.textContent = "SELESAI. Total dokumen carb_foods sekarang: " + snap.size + "\n\nKalau hasilnya 300, kembali ke Firebase Rules dan kunci write lagi.";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "GAGAL:\n" + err.message;
    seedBtn.disabled = false;
  }
});
</script>
